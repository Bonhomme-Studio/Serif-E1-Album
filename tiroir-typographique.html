<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test diagnostic WebGL</title>
<style>
  html,body{ margin:0; padding:0; background:#050505; color:#fff; font-family:-apple-system,Arial,sans-serif; }
  #status{
    position:fixed; top:0; left:0; right:0; z-index:10;
    padding:14px 18px; font-size:14px; line-height:1.5;
    background:rgba(0,0,0,0.6);
  }
  #status.ok{ background:rgba(20,120,60,0.85); }
  #status.error{ background:rgba(180,30,30,0.9); white-space:pre-wrap; }
  canvas{ display:block; }
</style>
</head>
<body>
<div id="status">Chargement de Three.js…</div>
<canvas id="stage"></canvas>

<script>
  document.getElementById('status').textContent = 'Three.js (CDN) charge…';
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
        onerror="document.getElementById('status').className='error'; document.getElementById('status').textContent='ECHEC: impossible de charger Three.js depuis cdnjs.cloudflare.com. Verifie ta connexion internet, un bloqueur de pub/script, ou un pare-feu reseau.';">
</script>
<script>
(function(){
  var statusEl = document.getElementById('status');
  function fail(msg){
    statusEl.className = 'error';
    statusEl.textContent = 'ERREUR: ' + msg;
  }
  try {
    if (typeof THREE === 'undefined') {
      fail('THREE est undefined : le script cdnjs ne s\'est pas charge (voir message ci-dessus ou la console F12).');
      return;
    }

    var canvas = document.getElementById('stage');
    var renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    } catch (e) {
      fail('WebGLRenderer a leve une exception : ' + e.message + '. Ton navigateur ou ta carte graphique ne supporte peut-etre pas WebGL ici.');
      return;
    }

    var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (!gl) {
      fail('Aucun contexte WebGL disponible sur ce navigateur/appareil.');
      return;
    }

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x050505, 1);

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.z = 3;

    var geo = new THREE.BoxGeometry(1,1,1);
    var mat = new THREE.MeshBasicMaterial({ color: 0xff5533, wireframe: true });
    var cube = new THREE.Mesh(geo, mat);
    scene.add(cube);

    window.addEventListener('resize', function(){
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
    });

    var frame = 0;
    function animate(){
      requestAnimationFrame(animate);
      cube.rotation.x += 0.01;
      cube.rotation.y += 0.015;
      renderer.render(scene, camera);
      frame++;
      if (frame === 5){
        statusEl.className = 'ok';
        statusEl.textContent = 'OK — WebGL fonctionne, le cube tourne. Le probleme vient donc d\'ailleurs dans la page principale, pas de ton navigateur.';
      }
    }
    animate();

  } catch (e) {
    fail((e && e.stack) || String(e));
  }
})();
</script>
</body>
</html>
