<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le tiroir typographique</title>
<style>
  :root{
    --bg:#050505;
    --fg:#EDEAE2;
    --fg-dim:rgba(237,234,226,0.45);
    --fg-faint:rgba(237,234,226,0.22);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--fg);
    overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  }

  #stage{
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    display:block;
    z-index:1;
  }

  #vignette{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:2;
    background:radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 35%, rgba(0,0,0,0.55) 100%);
  }

  #spacer{
    position:relative;
    width:100%;
    z-index:0;
  }

  .ui{
    position:fixed;
    left:0; right:0;
    z-index:3;
    pointer-events:none;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .brand{
    top:0;
    left:0;
    right:auto;
    position:fixed;
    z-index:3;
    padding:22px 24px;
    line-height:1.25;
  }
  .brand .name{
    font-size:13px;
    letter-spacing:0.02em;
    color:var(--fg);
    font-weight:600;
  }
  .brand .tag{
    font-size:11px;
    color:var(--fg-dim);
    margin-top:2px;
    font-style:italic;
    max-width:170px;
  }

  .counter{
    position:fixed;
    top:24px;
    right:24px;
    z-index:3;
    font-size:11px;
    color:var(--fg-dim);
    font-variant-numeric:tabular-nums;
    letter-spacing:0.03em;
  }
  .counter .cur{ color:var(--fg); }

  .caption{
    top:0;
    height:33.34vh;
    flex-direction:row;
    align-items:baseline;
    justify-content:center;
    gap:6px;
    text-align:center;
    padding:0 28px;
    transition:opacity 0.35s ease;
  }
  .caption .title{
    font-size:12.5px;
    font-weight:500;
    color:var(--fg-dim);
    letter-spacing:0.01em;
  }
  .caption .sep{
    font-size:12.5px;
    color:var(--fg-dim);
  }
  .caption .meta{
    font-size:12.5px;
    font-weight:500;
    color:var(--fg-dim);
    letter-spacing:0.01em;
  }
  .caption.fading{ opacity:0; }

  .hint{
    bottom:3.2%;
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    font-size:10.5px;
    color:var(--fg-faint);
    letter-spacing:0.08em;
    transition:opacity 0.6s ease;
  }
  .hint svg{
    width:14px; height:14px;
    animation:bob 1.6s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0); opacity:0.5; }
    50%{ transform:translateY(5px); opacity:1; }
  }
  .hint.hidden{ opacity:0; }

  .side-panel{
    display:none;
    position:fixed;
    top:50%;
    right:5%;
    transform:translateY(-50%);
    z-index:3;
    flex-direction:column;
    align-items:center;
    width:200px;
    pointer-events:none;
  }
  .side-panel img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
  }
  .side-text{
    margin-top:14px;
    text-align:center;
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:6px;
  }
  .side-title{
    font-size:11.5px;
    font-weight:500;
    color:var(--fg-dim);
    letter-spacing:0.01em;
  }
  .side-sep{
    font-size:11.5px;
    color:var(--fg-dim);
  }
  .side-meta{
    font-size:11.5px;
    font-weight:500;
    color:var(--fg-dim);
  }

  @media (orientation:landscape){
    .side-panel{ display:flex; right:auto; left:25%; transform:translate(-50%, -50%); width:min(46vw, 68vh); }
    .brand{ display:none; }
    .caption{ display:none; }
  }

  @media (max-width:600px){
    .brand{ display:none; }
    .counter{ top:18px; right:18px; }
  }

  @media (prefers-reduced-motion: reduce){
    .hint svg{ animation:none; }
  }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<div id="vignette"></div>

<div class="brand">
  <div class="name">Font&nbsp;Font&nbsp;Font</div>
  <div class="tag">Ainsi rangent, rangent, rangent&nbsp;— une discothèque de caractères</div>
</div>

<div class="counter"><span class="cur">01</span> / <span class="total">18</span></div>

<div class="ui caption" id="caption">
  <div class="title" id="capTitle">Helvetica</div>
  <div class="sep">·</div>
  <div class="meta" id="capMeta">Max Miedinger — 1957</div>
</div>

<div class="ui hint" id="hint">
  <span>faites défiler</span>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
</div>

<div class="side-panel" id="sidePanel">
  <img id="sidePanelImg" alt="">
  <div class="side-text">
    <div class="side-title" id="sideTitle">Helvetica</div>
    <div class="side-sep">·</div>
    <div class="side-meta" id="sideMeta">Max Miedinger — 1957</div>
  </div>
</div>

<div id="spacer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Data: 18 typefaces as "records" ----------
  var ALBUMS = [
    { name:"Helvetica",        meta:"Max Miedinger — 1957",     bg:"#0B0B0B", fg:"#EFEFEF", accent:"#D6402C", font:"800 210px 'Helvetica Neue', Arial, sans-serif", glyph:"H" },
    { name:"Garamond",         meta:"Claude Garamond — 1530",   bg:"#EDE6D6", fg:"#1B1B1B", accent:"#8C1F28", font:"italic 400 230px Georgia, 'Times New Roman', serif", glyph:"G" },
    { name:"Futura",           meta:"Paul Renner — 1927",       bg:"#C1272D", fg:"#F5F1E8", accent:"#101010", font:"700 220px 'Century Gothic', Futura, Arial, sans-serif", glyph:"F" },
    { name:"Didot",            meta:"Firmin Didot — 1784",      bg:"#151515", fg:"#EDEAE2", accent:"#C6A15B", font:"400 240px Didot, 'Bodoni MT', Georgia, serif", glyph:"D" },
    { name:"Univers",          meta:"Adrian Frutiger — 1957",   bg:"#1D2B53", fg:"#EDEAE2", accent:"#E8A93B", font:"500 200px 'Helvetica Neue', Arial, sans-serif", glyph:"U" },
    { name:"Bodoni",           meta:"Giambattista Bodoni — 1798", bg:"#E8A93B", fg:"#151515", accent:"#0B0B0B", font:"400 230px 'Bodoni MT', Didot, Georgia, serif", glyph:"B" },
    { name:"Baskerville",      meta:"John Baskerville — 1757",  bg:"#3A5A50", fg:"#F1EEE4", accent:"#E0C88C", font:"400 220px Baskerville, Georgia, serif", glyph:"B" },
    { name:"Gill Sans",        meta:"Eric Gill — 1928",         bg:"#F1EEE4", fg:"#1B1B1B", accent:"#35586B", font:"500 210px 'Gill Sans', 'Helvetica Neue', sans-serif", glyph:"G" },
    { name:"Frutiger",         meta:"Adrian Frutiger — 1976",   bg:"#35586B", fg:"#F1EEE4", accent:"#D9622B", font:"500 200px 'Frutiger', 'Helvetica Neue', sans-serif", glyph:"F" },
    { name:"Akzidenz Grotesk", meta:"H. Berthold AG — 1896",    bg:"#151515", fg:"#EDEAE2", accent:"#A6472E", font:"700 200px Arial, sans-serif", glyph:"A" },
    { name:"Caslon",           meta:"William Caslon — 1722",    bg:"#6E1E2C", fg:"#EDE6D6", accent:"#151515", font:"400 220px 'Caslon', Georgia, serif", glyph:"C" },
    { name:"Franklin Gothic",  meta:"M. F. Benton — 1902",      bg:"#232323", fg:"#EDEAE2", accent:"#D9622B", font:"800 200px 'Franklin Gothic Medium', Arial, sans-serif", glyph:"F" },
    { name:"Optima",           meta:"Hermann Zapf — 1958",      bg:"#4C5B3B", fg:"#F1EEE4", accent:"#E8A93B", font:"400 210px Optima, Georgia, sans-serif", glyph:"O" },
    { name:"DIN",              meta:"DIN-Normenausschuss — 1931", bg:"#1B1B1B", fg:"#EDEAE2", accent:"#3C7A6B", font:"700 200px 'DIN Alternate', Arial, sans-serif", glyph:"D" },
    { name:"Avenir",           meta:"Adrian Frutiger — 1988",   bg:"#B8862B", fg:"#151515", accent:"#F1EEE4", font:"600 210px Avenir, 'Century Gothic', sans-serif", glyph:"A" },
    { name:"Gotham",           meta:"Tobias Frere-Jones — 2000", bg:"#151515", fg:"#EDEAE2", accent:"#C1272D", font:"700 200px 'Gotham', Arial, sans-serif", glyph:"G" },
    { name:"Inter",            meta:"Rasmus Andersson — 2017",  bg:"#EDEAE2", fg:"#1B1B1B", accent:"#1D2B53", font:"600 200px Inter, Arial, sans-serif", glyph:"I" },
    { name:"Sabon",            meta:"Jan Tschichold — 1967",    bg:"#4B2142", fg:"#EDE6D6", accent:"#E0C88C", font:"400 230px Sabon, Georgia, serif", glyph:"S" }
  ];

  document.querySelector('.total').textContent = String(ALBUMS.length).padStart(2,'0');

  // ---------- Cover texture generation ----------
  function makeCoverTexture(album){
    var size = 512;
    var c = document.createElement('canvas');
    c.width = size; c.height = size;
    var ctx = c.getContext('2d');

    // background
    ctx.fillStyle = album.bg;
    ctx.fillRect(0,0,size,size);

    // subtle grain / texture via noise squares (cheap)
    ctx.globalAlpha = 0.035;
    for (var i=0;i<150;i++){
      ctx.fillStyle = (i % 2 === 0) ? '#ffffff' : '#000000';
      ctx.fillRect(Math.random()*size, Math.random()*size, 2, 2);
    }
    ctx.globalAlpha = 1;

    // (frame removed per request)

    // big glyph
    ctx.fillStyle = album.fg;
    ctx.font = album.font;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(album.glyph, size/2, size/2 + 30);

    // accent bar
    ctx.fillStyle = album.accent;
    ctx.fillRect(48, size-96, size-96, 8);

    // name label bottom
    ctx.fillStyle = album.fg;
    ctx.font = '600 30px -apple-system, Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(album.name, 48, size-52);

    ctx.fillStyle = album.accent;
    ctx.font = '400 18px -apple-system, Arial, sans-serif';
    ctx.fillText(album.meta.toUpperCase(), 48, size-24);

    var tex = new THREE.CanvasTexture(c);
    tex.anisotropy = 4;
    tex.needsUpdate = true;
    return { texture:tex, canvas:c };
  }

  // ---------- Three.js setup ----------
  var canvas = document.getElementById('stage');
  var renderer = new THREE.WebGLRenderer({ canvas:canvas, antialias:true, alpha:false, powerPreference:'high-performance' });
  renderer.setClearColor(0x050505, 1);
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(DPR);

  var scene = new THREE.Scene();
  var FOG_NEAR = 4;
  var FOG_FAR = 30;
  scene.fog = new THREE.Fog(0x050505, FOG_NEAR, FOG_FAR);

  var CAM_X = 2.8;
  var CAM_Y = 3.5;
  var CAM_Z = 4.6;
  var LOOK_Y = 0.7;    // matches the featured cover's height at full lift
  var LOOK_Z = -4.6;   // matches BASE_Z below: aim straight at the featured cover, not a distant point

  var camera = new THREE.PerspectiveCamera(46, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(CAM_X, CAM_Y, CAM_Z);
  camera.lookAt(0, LOOK_Y, LOOK_Z);

  var LANDSCAPE_CENTER_FRACTION = 0.75; // where the focal point should sit across the width, in landscape

  function sizeRenderer(){
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w,h);
    camera.aspect = w/h;
    camera.updateProjectionMatrix();

    if (w > h){
      var fullW = w * 2;
      var offsetX = w * (1 - LANDSCAPE_CENTER_FRACTION);
      camera.setViewOffset(fullW, h, offsetX, 0, w, h);
    } else {
      camera.clearViewOffset();
    }
  }
  sizeRenderer();

  // ---------- The drawer: covers alone against the black, no floor ----------
  var DRAWER_LENGTH = 46;
  var DRAWER_FAR_Z = -DRAWER_LENGTH + 6;

  // covers
  var coverCanvases = [];
  var covers = ALBUMS.map(function(album, i){
    var made = makeCoverTexture(album);
    coverCanvases.push(made.canvas);
    var geo = new THREE.PlaneGeometry(1.5, 1.5, 1, 1);
    var mat = new THREE.MeshBasicMaterial({ map:made.texture, transparent:true, fog:true });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.userData.index = i;
    mesh.userData.seedX = (Math.sin(i*12.9898) * 43758.5453 % 1) * 0.16;
    mesh.userData.seedR = (Math.sin(i*78.233) * 12543.123 % 1) * 0.05;
    scene.add(mesh);
    return mesh;
  });

  // ---------- Scroll model ----------
  var N = ALBUMS.length;
  var stepPx = Math.max(340, Math.round(window.innerHeight * 0.62));
  var spacer = document.getElementById('spacer');

  function layoutSpacer(){
    stepPx = Math.max(190, Math.round(window.innerHeight * 0.36));
    var totalScroll = (N - 1) * stepPx;
    spacer.style.height = (totalScroll + window.innerHeight) + 'px';
  }
  layoutSpacer();

  var smoothedIndex = 0;   // eased virtual index used for rendering
  var lastScrollY = window.scrollY;
  var scrollIdleTimer = null;
  var hasInteracted = false;
  var hint = document.getElementById('hint');

  function rawVirtualIndex(){
    var y = window.scrollY;
    var v = y / stepPx;
    return Math.max(0, Math.min(N-1, v));
  }

  function onScroll(){
    if (!hasInteracted){
      hasInteracted = true;
      hint.classList.add('hidden');
    }
    clearTimeout(scrollIdleTimer);
    scrollIdleTimer = setTimeout(snapToNearest, 90);
  }
  window.addEventListener('scroll', onScroll, { passive:true });

  function snapToNearest(){
    var target = Math.round(rawVirtualIndex());
    target = Math.max(0, Math.min(N-1, target));
    var y = target * stepPx;
    if (Math.abs(window.scrollY - y) > 1){
      window.scrollTo({ top:y, behavior:'smooth' });
    }
  }

  window.addEventListener('resize', function(){
    sizeRenderer();
    layoutSpacer();
  });

  // ---------- Caption ----------
  var captionEl = document.getElementById('caption');
  var capTitle = document.getElementById('capTitle');
  var capMeta = document.getElementById('capMeta');
  var counterEl = document.querySelector('.counter .cur');
  var sidePanelImg = document.getElementById('sidePanelImg');
  var sideTitle = document.getElementById('sideTitle');
  var sideMeta = document.getElementById('sideMeta');
  var activeDiscrete = -1;

  function updateCaption(discreteIndex){
    if (discreteIndex === activeDiscrete) return;
    activeDiscrete = discreteIndex;
    captionEl.classList.add('fading');
    counterEl.textContent = String(discreteIndex+1).padStart(2,'0');
    setTimeout(function(){
      var a = ALBUMS[discreteIndex];
      capTitle.textContent = a.name;
      capMeta.textContent = a.meta;
      captionEl.classList.remove('fading');
    }, 180);

    var a2 = ALBUMS[discreteIndex];
    sidePanelImg.src = coverCanvases[discreteIndex].toDataURL('image/png');
    sideTitle.textContent = a2.name;
    sideMeta.textContent = a2.meta;
  }

  // ---------- Layout constants: everything lives on Z, camera stays put ----------
  var WIDE_SPACING = 2.5;    // gap used only between the featured cover and its immediate neighbours
  var FAR_SPACING = 1.05;    // tighter gap for everything beyond that, so the rest of the stack packs closer
  var WIDE_RANGE = 1;        // how many index-steps on each side get the wide treatment
  var BASE_Z = -4.6;         // the "featured" position now sits mid-depth, not right up front
  var PASS_Z = CAM_Z - 1.3;  // once a cover's z passes this, it has "arrived" and starts vanishing
  var VANISH_Z = CAM_Z + 1.8;// fully gone by here

  function depthOffset(d){
    if (Math.abs(d) <= WIDE_RANGE){
      return d * WIDE_SPACING;
    }
    var sign = d > 0 ? 1 : -1;
    var beyond = Math.abs(d) - WIDE_RANGE;
    return sign * (WIDE_RANGE * WIDE_SPACING + beyond * FAR_SPACING);
  }
  var COVER_Y = -0.15;

  function focusBump(d){
    // 1 right at the focused cover, tapering off for neighbours
    d = Math.min(Math.abs(d), 1.4);
    return Math.max(0, 0.5 * (1 + Math.cos(d / 1.4 * Math.PI)));
  }

  var clock = new THREE.Clock();

  function animate(){
    requestAnimationFrame(animate);
    var t = clock.getElapsedTime();

    var raw = rawVirtualIndex();
    var target = (N - 1) - raw;   // inverted: scrolling down now sends covers away instead of pulling them in
    smoothedIndex += (target - smoothedIndex) * 0.6;

    updateCaption(Math.round(smoothedIndex));

    for (var i=0;i<covers.length;i++){
      var mesh = covers[i];
      var d = i - smoothedIndex;
      var z = BASE_Z - depthOffset(d);
      var focus = focusBump(d);

      var x = 0;
      var y = COVER_Y + focus * 0.85;
      var rotZ = focus * 0.16;

      if (!reduceMotion && focus > 0.985){
        y += Math.sin(t * 0.9) * 0.012;
      }

      mesh.position.set(x, y, z);
      mesh.rotation.set(0, 0, rotZ);
      mesh.scale.setScalar(1);

      // fade a cover in as it emerges from the dark, and out as it sails past the camera
      var arrival = Math.min(1, Math.max(0, (z - DRAWER_FAR_Z + 4) / 6));
      var passing = 1 - Math.min(1, Math.max(0, (z - PASS_Z) / (VANISH_Z - PASS_Z)));
      var opacity = arrival * passing;
      mesh.material.opacity = opacity;
      mesh.visible = opacity > 0.015;
      mesh.renderOrder = 100 - Math.round(z * 10);
    }

    renderer.render(scene, camera);
  }

  smoothedIndex = (N - 1) - rawVirtualIndex();
  animate();

})();
</script>
</body>
</html>
